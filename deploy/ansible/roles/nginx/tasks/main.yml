---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present

- name: Create ACME webroot
  ansible.builtin.file:
    path: /var/www/letsencrypt
    state: directory
    mode: "0755"

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Check for existing certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ server_name }}/fullchain.pem"
  register: nginx_cert

# Without a cert this renders the port-80 server only, so nginx can start and
# answer the ACME challenge. After certbot runs it is re-rendered with TLS.
- name: Install Thoth nginx site
  ansible.builtin.template:
    src: thoth.conf.j2
    dest: /etc/nginx/sites-available/thoth.conf
    mode: "0644"
  vars:
    nginx_tls_enabled: "{{ nginx_cert.stat.exists }}"
  notify: Reload nginx

- name: Enable Thoth nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/thoth.conf
    dest: /etc/nginx/sites-enabled/thoth.conf
    state: link
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Apply nginx changes before requesting a certificate
  ansible.builtin.meta: flush_handlers

- name: Obtain certificate
  ansible.builtin.command:
    argv: "{{ nginx_certbot_argv + (['--staging'] if letsencrypt_staging else []) }}"
    creates: "/etc/letsencrypt/live/{{ server_name }}/fullchain.pem"
  vars:
    nginx_certbot_argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path=/var/www/letsencrypt
      - --non-interactive
      - --agree-tos
      - --email={{ letsencrypt_email }}
      - --cert-name={{ server_name }}
      - --domain={{ server_name }}
  register: nginx_certbot_result

- name: Enable TLS site now that the certificate exists  # noqa: no-handler (must apply before the end-of-play reload)
  ansible.builtin.template:
    src: thoth.conf.j2
    dest: /etc/nginx/sites-available/thoth.conf
    mode: "0644"
  vars:
    nginx_tls_enabled: true
  when: nginx_certbot_result is changed
  notify: Reload nginx

- name: Reload nginx when certbot renews
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx

# The certbot package ships certbot.timer for renewal.
- name: Enable certbot renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started
