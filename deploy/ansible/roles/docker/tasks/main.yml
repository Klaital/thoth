---
# Docker Engine from Docker's own apt repo (distro packages lag and lack the
# compose v2 / buildx plugins).
- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Membership in the docker group is root-equivalent; it's what lets
# `make deploy` drive the daemon over ssh:// without sudo.
- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
