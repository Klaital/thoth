---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - awscli  # v2 in Ubuntu's own repo
      - ca-certificates
      - curl
      - gnupg
      - python3-debian  # for deb822_repository
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

# `limit` (rate-limited allow) matches the rule the VPS image ships with.
- name: Allow SSH through the firewall
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port | string }}"
    proto: tcp
  when: ufw_enabled

- name: Allow HTTP and HTTPS through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: ufw_enabled

- name: Enable firewall (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: ufw_enabled
