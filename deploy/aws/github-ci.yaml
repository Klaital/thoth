# IAM for GitHub Actions to push images to ECR via OIDC (no stored AWS keys).
#
#   aws cloudformation deploy --region us-west-2 --stack-name thoth-github-ci \
#     --template-file deploy/aws/github-ci.yaml --capabilities CAPABILITY_NAMED_IAM
#
# Only workflow runs on the main branch of the repo can assume the role.
# Jobs that set `environment:` get a different OIDC subject, so the build job
# in .github/workflows/ci.yml must not use one.
#
# GitHub's OIDC subject names the repo as <owner>@<owner id>/<repo>@<repo id>.
# The numeric IDs survive renames and stop a different repo that later takes
# the same name from matching. To find them for another repo, look at the
# userName of a failed AssumeRoleWithWebIdentity event in CloudTrail.
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for pushing Thoth images to ECR

Parameters:
  GitHubRepoSubject:
    Type: String
    Default: Klaital@4459559/thoth@1412546506
    Description: Repo as it appears in the OIDC sub claim (<owner>@<id>/<repo>@<id>).
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if the account already has the GitHub OIDC provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  PushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: thoth-github-ecr-push
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepoSubject}:ref:refs/heads/main
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/thoth/api
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/thoth/web

Outputs:
  RoleArn:
    Value: !GetAtt PushRole.Arn
