server {
    listen 80;
    server_name thoth.klaital.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thoth.klaital.com;

    ssl_certificate     /etc/letsencrypt/live/klaital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klaital.com/privkey.pem;

    # Serve the React SPA
    root /home/kit/bin/thoth/web;
    index index.html;

    # API and auth requests proxy to the Go backend
    location ~ ^/(v1|auth/google) {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests serve the SPA (React Router handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
