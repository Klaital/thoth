# Pull requests: run the checks (make `test` a required status check on main).
# Pushes to main: run the checks, push images to ECR tagged with the commit
# SHA, then deploy that SHA to prod.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs: a new push cancels the stale run. main: runs queue so deploys never
# overlap or get cut off part-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-west-2
  # From deploy/aws/github-ci.yaml
  AWS_ROLE_ARN: arn:aws:iam::813809418199:role/thoth-github-ecr-push
  DEPLOY_HOST: ubuntu@thoth.abandonedfactory.net

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Checks run as Dockerfile stages so CI uses the same codegen and toolchain
      # versions as the images.
      - name: Go vet + tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-go
          cache-from: type=gha,scope=go
          cache-to: type=gha,scope=go,mode=max

      # DB integration tests run against the compose MySQL (compose.override.yaml)
      # in a container from the test-integration stage, built here so it gets
      # the same layer cache as test-go.
      - name: Build integration test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-integration
          load: true
          tags: thoth-test-integration
          cache-from: type=gha,scope=go
          cache-to: type=gha,scope=go,mode=max

      - name: Integration tests (compose MySQL)
        run: docker compose -f compose.yaml -f compose.override.yaml -f compose.test.yaml run --rm test-integration

      - name: Stop compose stack
        if: always()
        run: docker compose -f compose.yaml -f compose.override.yaml -f compose.test.yaml down -v

      - name: Frontend typecheck, build, lint + tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  build:
    name: build (${{ matrix.target }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject and the AWS
    # role only trusts refs/heads/main.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - target: api
            cache: go
          - target: web
            cache: web
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push thoth/${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Single-manifest images keep the ECR repos free of attestation entries.
          provenance: false
          # Only the web-build stage uses these. VITE_FARO_URL is a public
          # collector URL (it ships in the JS bundle), so a repo variable.
          build-args: |
            VITE_FARO_URL=${{ vars.VITE_FARO_URL }}
            VITE_APP_VERSION=${{ github.sha }}
            VITE_APP_ENV=prod
          tags: |
            ${{ steps.ecr.outputs.registry }}/thoth/${{ matrix.target }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/thoth/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://thoth.abandonedfactory.net
    steps:
      - uses: actions/checkout@v7

      # The key is pinned server-side to /usr/local/bin/thoth-deploy (see
      # deploy/ansible/roles/app); the "command" sent is just the SHA, and the
      # compose files for this commit go over stdin.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Public fingerprint of the key in DEPLOY_SSH_KEY (ssh-keygen -lf <key>.pub).
          DEPLOY_KEY_FINGERPRINT: SHA256:V8lQ/xgTAlWhcs5AB21KKHTow8H3soCdY/dQyrM8N7g
        run: |
          install -m 700 -d ~/.ssh
          # Strip CRs: a key pasted via the Windows clipboard gets CRLF endings,
          # which OpenSSH rejects with "error in libcrypto".
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          fp="$(ssh-keygen -lf ~/.ssh/id_ed25519 2>/dev/null | awk '{print $2}')" || true
          if [ "$fp" != "$DEPLOY_KEY_FINGERPRINT" ]; then
            echo "::error::DEPLOY_SSH_KEY is not a valid copy of the deploy key (got fingerprint '${fp:-unreadable}', want $DEPLOY_KEY_FINGERPRINT). Re-paste the whole private key file, including the BEGIN/END lines."
            exit 1
          fi
          cp deploy/known_hosts ~/.ssh/known_hosts
          tar -c compose.yaml compose.prod.yaml \
            | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$GITHUB_SHA"
