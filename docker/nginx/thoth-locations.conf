# Shared by the HTTP and TLS server blocks.

root  /usr/share/nginx/html;
index index.html;

# API and backend OAuth routes proxy to the Go server. /auth/callback is a
# frontend route, so only /auth/google* goes to the backend.
location ~ ^/(v1|auth/google) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else is the SPA; React Router handles client-side routes.
location / {
    try_files $uri $uri/ /index.html;
}
