syntax = "proto3";

package thoth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/klaital/thoth/internal/gen/thoth/v1;thothv1";

enum SealedItemType {
  SEALED_ITEM_TYPE_UNSPECIFIED           = 0;
  SEALED_ITEM_TYPE_SECRET_LAIR           = 1;
  SEALED_ITEM_TYPE_PLAY_BOOSTER          = 2;
  SEALED_ITEM_TYPE_PLAY_BOOSTER_BOX      = 3;
  SEALED_ITEM_TYPE_COLLECTOR_BOOSTER     = 4;
  SEALED_ITEM_TYPE_COLLECTOR_BOOSTER_BOX = 5;
  SEALED_ITEM_TYPE_BUNDLE                = 6;
  SEALED_ITEM_TYPE_DRAFT_NIGHT           = 7;
  SEALED_ITEM_TYPE_DRAFT_BOOSTER         = 8;
  SEALED_ITEM_TYPE_DRAFT_BOOSTER_BOX     = 9;
  SEALED_ITEM_TYPE_SET_BOOSTER           = 10;
  SEALED_ITEM_TYPE_SET_BOOSTER_BOX       = 11;
  SEALED_ITEM_TYPE_JUMPSTART_BOOSTER     = 12;
  SEALED_ITEM_TYPE_JUMPSTART_BOOSTER_BOX = 13;
  SEALED_ITEM_TYPE_COMMANDER_PRECON      = 14;
  SEALED_ITEM_TYPE_PRERELEASE_PACK       = 15;
}

message SealedItem {
  int64 id = 1;
  int64 collection_id = 2;
  SealedItemType item_type = 3;
  optional string set_code = 4;
  optional string name = 5;
  int32 quantity = 6;
  string notes = 7;
}

message AddSealedItemRequest {
  int64 collection_id = 1;
  SealedItemType item_type = 2;
  optional string set_code = 3;
  optional string name = 4;
  int32 quantity = 5;
  string notes = 6;
}

message AddSealedItemResponse {
  SealedItem item = 1;
}

message ListSealedItemsRequest {
  int64 collection_id = 1;
}

message ListSealedItemsResponse {
  repeated SealedItem items = 1;
}

message UpdateSealedItemRequest {
  int64 id = 1;
  SealedItemType item_type = 2;
  optional string set_code = 3;
  optional string name = 4;
  int32 quantity = 5;
  string notes = 6;
}

message UpdateSealedItemResponse {
  SealedItem item = 1;
}

message RemoveSealedItemRequest {
  int64 id = 1;
}

message RemoveSealedItemResponse {}

message BulkImportSealedItemsRequest {
  int64 collection_id = 1;
  // One product per line. Blank lines are ignored.
  string text = 2;
}

message BulkImportLineResult {
  int32 line_number = 1;
  string line = 2;
  // Set when the line was added (or merged into a duplicate line's item).
  SealedItem item = 3;
  // Non-fatal issue, e.g. the set name could not be matched to a set code.
  string warning = 4;
  string error = 5;
}

message BulkImportSealedItemsResponse {
  repeated BulkImportLineResult results = 1;
}

message LookupUPCRequest {
  string upc = 1;
}

message LookupUPCResponse {
  string name = 1;
  string set_name = 2;
  SealedItemType item_type = 3;
  string set_code = 4;
}

service SealedItemService {
  rpc AddSealedItem(AddSealedItemRequest) returns (AddSealedItemResponse) {
    option (google.api.http) = {
      post: "/v1/collections/{collection_id}/sealed"
      body: "*"
    };
  }

  rpc ListSealedItems(ListSealedItemsRequest) returns (ListSealedItemsResponse) {
    option (google.api.http) = {
      get: "/v1/collections/{collection_id}/sealed"
    };
  }

  rpc UpdateSealedItem(UpdateSealedItemRequest) returns (UpdateSealedItemResponse) {
    option (google.api.http) = {
      patch: "/v1/sealed/{id}"
      body: "*"
    };
  }

  rpc RemoveSealedItem(RemoveSealedItemRequest) returns (RemoveSealedItemResponse) {
    option (google.api.http) = {
      delete: "/v1/sealed/{id}"
    };
  }

  rpc BulkImportSealedItems(BulkImportSealedItemsRequest) returns (BulkImportSealedItemsResponse) {
    option (google.api.http) = {
      post: "/v1/collections/{collection_id}/sealed/bulk"
      body: "*"
    };
  }

  rpc LookupUPC(LookupUPCRequest) returns (LookupUPCResponse) {
    option (google.api.http) = {
      get: "/v1/upc/{upc}"
    };
  }
}
