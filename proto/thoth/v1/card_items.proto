syntax = "proto3";

package thoth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/klaital/thoth/internal/gen/thoth/v1;thothv1";

enum FoilTreatment {
  FOIL_TREATMENT_UNSPECIFIED = 0;
  FOIL_TREATMENT_NONFOIL = 1;
  FOIL_TREATMENT_FOIL = 2;
  FOIL_TREATMENT_ETCHED = 3;
}

enum CardCategory {
  CARD_CATEGORY_UNSPECIFIED = 0;
  CARD_CATEGORY_NONE        = 1;
  CARD_CATEGORY_COMMANDER   = 2;
  CARD_CATEGORY_DECK        = 3;
  CARD_CATEGORY_SIDEBOARD   = 4;
}

message CardItem {
  int64 id = 1;
  int64 collection_id = 2;
  string scryfall_card_id = 3;
  FoilTreatment foil_treatment = 4;
  int32 quantity = 5;
  string notes = 6;
  // Denormalized from scryfall_cards for display convenience.
  string card_name = 7;
  string set_code = 8;
  string image_uri = 9;
  string collector_number = 10;
  // JSON-encoded price map from Scryfall (usd, usd_foil, usd_etched, etc.)
  string prices_json = 11;
  CardCategory category = 12;
  // Link to the card's page on scryfall.com. Empty until the syncer has run
  // since this field was added.
  string scryfall_uri = 13;
}

message AddCardItemRequest {
  int64 collection_id = 1;
  string scryfall_card_id = 2;
  FoilTreatment foil_treatment = 3;
  int32 quantity = 4;
  string notes = 5;
  // Unspecified is stored as NONE.
  CardCategory category = 6;
}

message AddCardItemResponse {
  CardItem item = 1;
}

message ListCardItemsRequest {
  int64 collection_id = 1;
}

message ListCardItemsResponse {
  repeated CardItem items = 1;
}

message UpdateCardItemRequest {
  int64 id = 1;
  int32 quantity = 2;
  string notes = 3;
  // Left unchanged when omitted. Moving into a category that already holds the
  // same card and foil treatment merges the two rows.
  optional CardCategory category = 4;
}

message UpdateCardItemResponse {
  CardItem item = 1;
}

message RemoveCardItemRequest {
  int64 id = 1;
}

message RemoveCardItemResponse {}

message BulkImportCardItemsRequest {
  int64 collection_id = 1;
  // Moxfield text format, one card per line: "4 Lightning Bolt (M20) 141 *F*".
  string text = 2;
  // Category for imported cards. Unspecified is stored as NONE. If the text
  // has "Commander", "Deck" or "Sideboard" header lines, those set the
  // category of the cards after them instead, and cards before the first
  // header go in DECK.
  CardCategory category = 3;
}

message BulkImportCardLineResult {
  int32 line_number = 1;
  string line = 2;
  // Set when the line was added.
  CardItem item = 3;
  // Non-fatal issue, e.g. the name didn't match the printing found.
  string warning = 4;
  string error = 5;
  // Card name parsed from the line; empty if the line couldn't be parsed.
  string name = 6;
}

service CardItemService {
  rpc AddCardItem(AddCardItemRequest) returns (AddCardItemResponse) {
    option (google.api.http) = {
      post: "/v1/collections/{collection_id}/cards"
      body: "*"
    };
  }

  // Streams one result per card line, in line order, as each is processed.
  rpc BulkImportCardItems(BulkImportCardItemsRequest) returns (stream BulkImportCardLineResult) {
    option (google.api.http) = {
      post: "/v1/collections/{collection_id}/cards/bulk"
      body: "*"
    };
  }

  rpc ListCardItems(ListCardItemsRequest) returns (ListCardItemsResponse) {
    option (google.api.http) = {
      get: "/v1/collections/{collection_id}/cards"
    };
  }

  rpc UpdateCardItem(UpdateCardItemRequest) returns (UpdateCardItemResponse) {
    option (google.api.http) = {
      patch: "/v1/cards/{id}"
      body: "*"
    };
  }

  rpc RemoveCardItem(RemoveCardItemRequest) returns (RemoveCardItemResponse) {
    option (google.api.http) = {
      delete: "/v1/cards/{id}"
    };
  }
}
